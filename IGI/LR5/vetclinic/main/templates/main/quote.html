{% extends 'base.html' %}

{% block title %}Цитата дня{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="mb-4">Цитата дня</h1>
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    {% if quote.error %}
                        <div class="alert alert-danger">Ошибка: {{ quote.error }}</div>
                    {% else %}
                        <blockquote class="blockquote mb-0">
                            <p>{{ quote.content }}</p>
                            <footer class="blockquote-footer">{{ quote.author }}</footer>
                        </blockquote>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
