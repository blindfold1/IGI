{% extends 'base.html' %}

{% block title %}
    {% if object %}Редактирование новости{% else %}Новая новость{% endif %}
{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h2 class="card-title mb-4">
                        {% if object %}Редактирование новости{% else %}Новая новость{% endif %}
                    </h2>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_title" class="form-label">Заголовок</label>
                            <input type="text" name="title" id="id_title" class="form-control" value="{{ object.title|default:'' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_content" class="form-label">Содержание</label>
                            <textarea name="content" id="id_content" class="form-control" rows="10" required>{{ object.content|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label for="id_image" class="form-label">Изображение</label>
                            {% if object.image %}
                                <div class="mb-2">
                                    <img src="{{ object.image.url }}" alt="Текущее изображение" class="img-thumbnail" style="max-height: 200px;">
                                </div>
                            {% endif %}
                            <input type="file" name="image" id="id_image" class="form-control">
                        </div>
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'news_list' %}" class="btn btn-outline-secondary">Отмена</a>
                            <button type="submit" class="btn btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
